name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/build-native

      - uses: actions/upload-artifact@v4
        with:
          name: vrdrum_native
          path: addons/vrdrum_native/bin

  test:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Test against the libraries just built from native/, not the committed ones.
      - uses: actions/download-artifact@v4
        with:
          name: vrdrum_native
          path: addons/vrdrum_native/bin

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Import project
        run: ~/godot/godot --headless --xr-mode off --audio-driver Dummy --import

      - name: Run tests
        run: ~/godot/godot --headless --xr-mode off --audio-driver Dummy --script res://tests/run_tests.gd

      - name: Smoke-run main scene
        run: |
          ~/godot/godot --headless --xr-mode off --audio-driver Dummy --quit-after 300 2>&1 | tee run.log
          ! grep -E "SCRIPT ERROR|^ERROR" run.log

      - name: Performance smoke test
        run: ~/godot/godot --headless --xr-mode off --audio-driver Dummy --script res://tools/benchmark.gd
